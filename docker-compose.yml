# Full stack: Ollama + FastAPI kernel + Next.js dashboard.
#
#   docker compose up
#
# Then open http://localhost:3000. No API keys are required — with none
# configured the kernel runs in Ollama-only mode, which is the same path a
# fresh clone takes.
#
# To use your own provider keys, copy the template and point AIOS_CONFIG at it:
#   cp kernel/config.yaml.example kernel/config.yaml   # then edit
#   AIOS_CONFIG=./kernel/config.yaml docker compose up

services:
  ollama:
    image: ollama/ollama:latest
    # Deliberately NOT published to the host. Only the backend talks to it, and
    # publishing 11434 would fail to bind for anyone already running Ollama
    # natively — which is a large share of the people this stack is for.
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: pulls the embedding model, then exits. Kept as its own service so
  # the backend can wait for it to *complete* rather than racing it.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text"]
    volumes:
      - ollama-models:/root/.ollama
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Overridable because Windows reserves blocks of ports for Hyper-V and
      # 8000 often lands inside one. The symptom is a bind failure at startup
      # ("access to a socket ... forbidden") even though nothing is listening:
      #   netsh interface ipv4 show excludedportrange protocol=tcp
      # If 8000 is excluded, run:  AIOS_API_PORT=8010 docker compose up
      - "${AIOS_API_PORT:-8000}:8000"
    environment:
      # Wins over the mounted config.yaml, which necessarily says "localhost"
      # because it is written for a host install.
      AIOS_OLLAMA_HOST: http://ollama:11434
    volumes:
      # Config is MOUNTED, never baked into the image, so keys stay on the host.
      # Defaults to the tracked template so a clean clone comes up with no setup
      # at all; the template carries placeholders only, giving Ollama-only mode.
      - ${AIOS_CONFIG:-./kernel/config.yaml.example}:/app/kernel/config.yaml:ro
      - chroma-data:/app/chroma_db
      - fs-root:/app/fs_root
    depends_on:
      # Waits for the model to finish downloading. Without this the backend can
      # start while Ollama has no model, and because the embedding backend is
      # selected once per process it would silently stay on the hashing
      # fallback for the whole run.
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time, so it must be the URL the
        # BROWSER uses — the published host port, not the compose service name.
        # Derived from AIOS_API_PORT so changing the port stays a one-knob edit.
        NEXT_PUBLIC_API_BASE: http://localhost:${AIOS_API_PORT:-8000}
    ports:
      - "${AIOS_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama-models:
  chroma-data:
  fs-root:
